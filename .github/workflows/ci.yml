name: CI

# Fast feedback for every change. The release workflow calls this file through
# `workflow_call`, so the test steps are defined once.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          check-latest: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l internal tools main.go)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'ed:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Go tests
        run: go test ./internal/... ./tools/...

      # Wails' Linux backend needs GTK headers; vet the platform the app ships
      # on instead, matching the Windows compile check below.
      - name: Go vet
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./...

      - name: Check version files
        run: go run ./tools/release check

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck and test the frontend
        working-directory: frontend
        run: |
          npx tsc --noEmit
          npm test

      - name: Build the frontend
        working-directory: frontend
        run: npm run build

      # main.go embeds frontend/dist, and the Linux backend needs GTK headers,
      # so the app is compile-checked against the platform that ships it.
      - name: Compile the app for Windows
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./...
