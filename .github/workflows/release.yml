name: Release

# Push a tag such as v1.0.0 to test, build and publish a GitHub Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: "24"

jobs:
  verify:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          check-latest: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^  version: "\(.*\)".*/\1/p' build/config.yml | head -n1)"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match build/config.yml version $version" >&2
            exit 1
          fi

      - name: Go tests
        run: go test ./internal/...

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck and frontend tests
        working-directory: frontend
        run: |
          npx tsc --noEmit
          npm test

  windows:
    name: Windows (MSI + NSIS)
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          check-latest: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI from the pinned module
        shell: pwsh
        working-directory: third_party/wails
        run: |
          go install ./cmd/wails3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = go env GOBIN
          if (-not $bin) { $bin = Join-Path (go env GOPATH) "bin" }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          & (Join-Path $bin "wails3.exe") version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Build Windows binary and NSIS installer
        shell: pwsh
        run: |
          $bin = go env GOBIN
          if (-not $bin) { $bin = Join-Path (go env GOPATH) "bin" }
          $env:PATH = "$bin;$env:PATH"
          wails3 package INSTALL_SCOPE=user
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build MSI
        shell: pwsh
        run: |
          $wix = Join-Path $env:RUNNER_TEMP "wix314"
          if (-not (Test-Path (Join-Path $wix "candle.exe"))) {
            $zip = Join-Path $env:RUNNER_TEMP "wix314.zip"
            Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $wix -Force
          }
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -match '^\d+\.\d+$') { $version = "$version.0" }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { $version = "0.0.0" }
          ./build/windows/msi/build.ps1 -Version $version -WixDir $wix

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item bin/memo-amd64-installer.exe dist/memo-windows-amd64-installer.exe
          Copy-Item bin/memo-windows-amd64.msi dist/memo-windows-amd64.msi

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS (universal DMG)
    runs-on: macos-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          check-latest: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI from the pinned module
        run: |
          set -euo pipefail
          cd third_party/wails
          go install ./cmd/wails3
          bindir="$(go env GOBIN)"
          [ -n "$bindir" ] || bindir="$(go env GOPATH)/bin"
          echo "$bindir" >> "$GITHUB_PATH"
          "$bindir/wails3" version

      - name: Build universal .app
        run: |
          set -euo pipefail
          bindir="$(go env GOBIN)"
          [ -n "$bindir" ] || bindir="$(go env GOPATH)/bin"
          export PATH="$bindir:$PATH"
          wails3 task darwin:package:universal

      - name: Build DMG
        run: |
          set -euo pipefail
          bindir="$(go env GOBIN)"
          [ -n "$bindir" ] || bindir="$(go env GOPATH)/bin"
          export PATH="$bindir:$PATH"
          wails3 task darwin:create:dmg

      - name: Collect artifacts
        run: |
          mkdir -p dist
          dmg="$(find bin -maxdepth 1 -name '*.dmg' -print -quit)"
          if [ -z "$dmg" ]; then
            echo "DMG not found under bin" >&2
            ls -la bin >&2
            exit 1
          fi
          cp "$dmg" dist/memo-macos-universal.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [windows, macos]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: |
          ls -lh
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: memo ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            memo ${{ github.ref_name }} — 本地优先的桌面速记，可选归档到 Notion。

            **Windows**
            - `memo-windows-amd64.msi`：推荐，按用户安装，无需管理员权限。
            - `memo-windows-amd64-installer.exe`：NSIS 安装包，同样按用户安装。

            **macOS**（Intel + Apple Silicon 通用）
            - `memo-macos-universal.dmg`

            安装包未签名、未公证。Windows SmartScreen 可能需要“更多信息 → 仍要运行”；macOS 首次打开请右键 → 打开。

            校验下载：`SHA256SUMS.txt`。
          files: artifacts/*
