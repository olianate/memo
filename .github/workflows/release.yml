name: Release

# Push a tag such as v1.4.0 to test, build and publish a GitHub Release.
# Manual runs only build the installers; they never publish.
on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to verify (defaults to build/config.yml)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"

jobs:
  # The test steps live in ci.yml so pull requests and releases run exactly the
  # same checks.
  verify:
    name: Tests
    uses: ./.github/workflows/ci.yml

  # Runs before the expensive platform builds. A tag release must come from
  # main, carry the same version in all 15 locations, and have release notes.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          check-latest: true

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            version="$INPUT_VERSION"
          else
            version="$(go run ./tools/release print)"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Verify the tag is on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if ! git merge-base --is-ancestor "$commit" FETCH_HEAD; then
            echo "::error::Tag ${GITHUB_REF_NAME} ($commit) is not on main; merge the release PR first."
            exit 1
          fi

      - name: Check version files and release notes
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          args=(check "$VERSION")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            args+=(-notes)
          fi
          go run ./tools/release "${args[@]}"

  windows:
    name: Windows (MSI + NSIS)
    runs-on: windows-latest
    needs: [verify, preflight]
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          check-latest: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI from the pinned module
        shell: pwsh
        working-directory: third_party/wails
        run: |
          go install ./cmd/wails3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = go env GOBIN
          if (-not $bin) { $bin = Join-Path (go env GOPATH) "bin" }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          & (Join-Path $bin "wails3.exe") version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress --limit-output -y
          if ($LASTEXITCODE -ne 0) { throw "choco install nsis failed with exit code $LASTEXITCODE" }

          # The chocolatey package runs the NSIS installer into Program Files and
          # updates the *machine* PATH. This step's process - and therefore every
          # later step, which inherits the runner's original environment - keeps
          # the old PATH, so `makensis` stays invisible even though it exists.
          # Resolve the binary explicitly and publish the directory to the job.
          $programRoots = @(${env:ProgramFiles(x86)}, $env:ProgramFiles) | Where-Object { $_ }
          $nsisDir = $programRoots |
            ForEach-Object { Join-Path $_ 'NSIS' } |
            Where-Object { Test-Path (Join-Path $_ 'makensis.exe') } |
            Select-Object -First 1

          if (-not $nsisDir) {
            $found = Get-ChildItem -Path $programRoots -Filter makensis.exe -Recurse -Depth 3 -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($found) { $nsisDir = $found.DirectoryName }
          }
          if (-not $nsisDir) { throw 'NSIS was installed but makensis.exe was not found' }

          & (Join-Path $nsisDir 'makensis.exe') -VERSION
          if ($LASTEXITCODE -ne 0) { throw "makensis.exe at $nsisDir failed to run (exit $LASTEXITCODE)" }

          "NSIS_BIN=$nsisDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Add-Content -Path $env:GITHUB_PATH -Value $nsisDir
          Write-Output "NSIS ready: $nsisDir"

      - name: Build Windows binary and NSIS installer
        shell: pwsh
        run: |
          $bin = go env GOBIN
          if (-not $bin) { $bin = Join-Path (go env GOPATH) "bin" }
          # NSIS_BIN comes from the previous step; keep GOBIN first for wails3.
          $env:PATH = "$bin;$env:NSIS_BIN;$env:PATH"
          Get-Command makensis -ErrorAction Stop | ForEach-Object { Write-Output "makensis: $($_.Source)" }
          wails3 package INSTALL_SCOPE=user
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build MSI
        shell: pwsh
        run: |
          $wix = Join-Path $env:RUNNER_TEMP "wix314"
          if (-not (Test-Path (Join-Path $wix "candle.exe"))) {
            $zip = Join-Path $env:RUNNER_TEMP "wix314.zip"
            Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $wix -Force
          }
          $version = $env:VERSION
          if ($version -match '^\d+\.\d+$') { $version = "$version.0" }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "MSI version must be X.Y.Z, got '$version'"
          }
          ./build/windows/msi/build.ps1 -Version $version -WixDir $wix

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item bin/memo-amd64-installer.exe dist/memo-windows-amd64-installer.exe
          Copy-Item bin/memo-windows-amd64.msi dist/memo-windows-amd64.msi

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS (universal DMG)
    runs-on: macos-latest
    needs: [verify, preflight]
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          check-latest: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI from the pinned module
        run: |
          set -euo pipefail
          cd third_party/wails
          go install ./cmd/wails3
          bindir="$(go env GOBIN)"
          [ -n "$bindir" ] || bindir="$(go env GOPATH)/bin"
          echo "$bindir" >> "$GITHUB_PATH"
          "$bindir/wails3" version

      - name: Build universal .app
        run: |
          set -euo pipefail
          bindir="$(go env GOBIN)"
          [ -n "$bindir" ] || bindir="$(go env GOPATH)/bin"
          export PATH="$bindir:$PATH"
          wails3 task darwin:package:universal

      - name: Verify the macOS 26 icon bundle
        run: |
          set -euo pipefail
          app="bin/memo.app"
          test -d "$app" || { echo "::error::$app was not produced"; exit 1; }

          /usr/bin/actool --version 2>/dev/null || true

          if /usr/bin/plutil -extract CFBundleIconName raw -o - "$app/Contents/Info.plist" 2>/dev/null | grep -qx appicon; then
            echo "Info.plist: CFBundleIconName=appicon"
          else
            echo "::warning file=build/darwin/Info.plist::CFBundleIconName is missing from the app bundle"
          fi

          if [ -f "$app/Contents/Resources/Assets.car" ]; then
            echo "Assets.car: present ($(wc -c < "$app/Contents/Resources/Assets.car") bytes)"
          else
            echo "::warning::Assets.car missing - the macOS 26 icon style needs actool 26+ (Xcode 26); this build fell back to icons.icns"
          fi

      - name: Build DMG
        run: |
          set -euo pipefail
          bindir="$(go env GOBIN)"
          [ -n "$bindir" ] || bindir="$(go env GOPATH)/bin"
          export PATH="$bindir:$PATH"
          wails3 task darwin:create:dmg

      - name: Collect artifacts
        run: |
          mkdir -p dist
          dmg="$(find bin -maxdepth 1 -name '*.dmg' -print -quit)"
          if [ -z "$dmg" ]; then
            echo "DMG not found under bin" >&2
            ls -la bin >&2
            exit 1
          fi
          cp "$dmg" dist/memo-macos-universal.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [preflight, windows, macos]
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: |
          ls -lh
          sha256sum * > SHA256SUMS.txt

      - name: Compose release notes
        run: |
          set -euo pipefail
          notes="docs/releases/v${VERSION}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::Missing release notes: $notes"
            exit 1
          fi
          out="$RUNNER_TEMP/release-notes.md"
          {
            printf 'memo v%s — 本地优先的桌面速记，可选归档到 Notion。\n\n' "$VERSION"
            cat "$notes"
            printf '\n**Windows**\n'
            printf '%s\n' '- `memo-windows-amd64.msi`：推荐，按用户安装，无需管理员权限。'
            printf '%s\n' '- `memo-windows-amd64-installer.exe`：NSIS 安装包，同样按用户安装。'
            printf '\n**macOS**（Intel + Apple Silicon 通用）\n'
            printf '%s\n' '- `memo-macos-universal.dmg`'
            printf '\n安装包未签名、未公证。Windows SmartScreen 可能需要“更多信息 → 仍要运行”；macOS 首次打开请右键 → 打开。\n\n'
            printf '校验下载：`SHA256SUMS.txt`。\n'
          } > "$out"
          cat "$out" >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: memo v${{ needs.preflight.outputs.version }}
          tag_name: ${{ github.ref_name }}
          make_latest: true
          fail_on_unmatched_files: true
          body_path: ${{ runner.temp }}/release-notes.md
          files: artifacts/*
